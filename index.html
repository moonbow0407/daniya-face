<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>捏捏达妮娅</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" data-state="loading">
    <div id="stage"></div>
    <div class="fade"></div>

    <div class="toolbar left" role="toolbar" aria-label="设置">
      <button id="sound-tool" type="button" aria-pressed="true" title="关闭音效">
        <svg viewBox="0 0 28 24" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h5l6-5v16l-6-5H3z"/><path class="wave" d="M18 8.5q2.5 3.5 0 7M21.5 5.5q5 6.5 0 13"/><path class="mute" d="m19 9 6 6m0-6-6 6" style="display:none"/></svg>
        <span>音效</span>
      </button>
      <a id="source-link" class="tool-link" href="https://github.com/moonbow0407/daniya-face" target="_blank" rel="noopener" title="在 GitHub 上查看源码" aria-label="在 GitHub 上查看源码">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 1.6a10.4 10.4 0 0 0-3.29 20.27c.52.1.71-.23.71-.5v-1.77c-2.9.63-3.51-1.4-3.51-1.4-.47-1.2-1.15-1.52-1.15-1.52-.95-.65.07-.64.07-.64 1.05.07 1.6 1.08 1.6 1.08.93 1.6 2.45 1.14 3.04.87.1-.68.37-1.14.66-1.4-2.31-.27-4.75-1.16-4.75-5.15 0-1.14.4-2.07 1.08-2.8-.11-.27-.47-1.33.1-2.77 0 0 .88-.28 2.86 1.07a9.9 9.9 0 0 1 5.2 0c1.98-1.35 2.86-1.07 2.86-1.07.57 1.44.21 2.5.1 2.77.67.73 1.08 1.66 1.08 2.8 0 4-2.44 4.88-4.76 5.14.37.32.71.96.71 1.93v2.86c0 .28.19.61.72.5A10.4 10.4 0 0 0 12 1.6Z"/></svg>
        <span>源码</span>
      </a>
      <a id="origin-link" class="tool-link" href="https://phoebe-face-lab.vercel.app/" target="_blank" rel="noopener" title="访问菲比捏脸模拟器原站" aria-label="访问菲比捏脸模拟器原站">
        <svg viewBox="0 0 28 24" width="28" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.4 10.1C6.0 3.3 9.2 1.8 14 1.8C18.8 1.8 22.0 3.3 22.6 10.1"/>
          <path d="M6.0 7.7Q10.0 5.8 14 7.6Q18.0 5.8 22.0 7.7" stroke-width="1.3"/>
          <path d="M1.4 10.5Q14 9.7 26.6 10.5" stroke-width="1.7"/>
          <path d="M5.6 10.6C4.7 12.8 4.6 14.8 5.0 16.5"/>
          <path d="M22.4 10.6C23.3 12.8 23.4 14.8 23.0 16.5"/>
          <path d="M19.8 11.7l2.1 2.1m0-2.1l-2.1 2.1" stroke-width="1.35"/>
          <circle cx="6.2" cy="18.8" r="2.45"/>
          <circle cx="21.8" cy="18.8" r="2.45"/>
          <path d="M8.5 20.6Q14 21.8 19.5 20.6"/>
          <ellipse cx="11.2" cy="16.5" rx="1.4" ry="2.25" fill="currentColor" stroke="none"/>
          <ellipse cx="16.8" cy="16.5" rx="1.4" ry="2.25" fill="currentColor" stroke="none"/>
          <path d="M13.3 19.3Q14 20.0 14.7 19.3" stroke-width="1.35"/>
        </svg>
        <span>原站</span>
      </a>
    </div>

    <div class="toolbar right" role="toolbar" aria-label="脸部动作">
      <button data-mode="cup" type="button" aria-pressed="false" title="捧脸">
        <svg viewBox="0 0 28 24" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8q-1 9 10 12Q25 17 24 8"/><path d="M9 9q5 4 10 0"/></svg>
        <span>捧脸</span>
      </button>
      <button data-mode="poke" type="button" aria-pressed="true">
        <svg viewBox="0 0 28 24" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21V8a2 2 0 0 1 4 0v6l5 1q3 1 2 4l-1 2"/><path d="M5 5l2 2M13 1v3M21 5l-2 2"/></svg>
        <span>戳脸</span>
      </button>
      <button data-mode="single" type="button" aria-pressed="false">
        <svg viewBox="0 0 28 24" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5a7 7 0 1 0 0 14M13 12h12m-4-4 4 4-4 4"/></svg>
        <span>单手拉脸</span>
      </button>
      <button data-mode="double" type="button" aria-pressed="false">
        <svg viewBox="0 0 28 24" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6q4-3 8 0m-8 12q4 3 8 0M2 12h8m-5-3-3 3 3 3m13-3h8m-3-3 3 3-3 3"/></svg>
        <span>双手拉脸</span>
      </button>
      <button id="rhythm-tool" type="button" aria-pressed="false" title="开始或退出音游">
        <svg viewBox="0 0 28 24" width="26" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18V5l12-2v13"/><circle cx="7" cy="18" r="3"/><circle cx="19" cy="16" r="3"/></svg>
        <span>音游</span>
      </button>
    </div>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader-card">
        <img src="/loading.jpg" alt="达妮娅" width="960" height="1146" decoding="async" fetchpriority="high" />
        <div class="loader-bar"><i id="loader-fill"></i></div>
        <div class="loader-text"><span id="loader-label">正在召唤达妮娅…</span><span id="loader-pct">0%</span></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
